# 成語炸彈超人 多人伺服器 Render 設定　v6.0　2026-10-21
services:
  - type: web
    name: bomber-idiom-multiplayer
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEACHER_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_ROOMS
        value: "12"
